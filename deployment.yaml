apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsync-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsync
  template:
    metadata:
      labels:
        app: finsync
    spec:
      containers:
      - name: finsync-container
        image: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/finsync-repo:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: finsync-service
spec:
  type: LoadBalancer
  selector:
    app: finsync
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
